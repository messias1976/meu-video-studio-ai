[package]
name = "meu-video-studio-ai"
version = "1.0.0"
description = "Editor de vídeo desktop local"
authors = ["Messias Machado"]
edition = "2021"

[lib]
name = "meu_video_studio_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
